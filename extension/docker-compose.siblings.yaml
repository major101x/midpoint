# Overlay selected by `USE_LOCAL_SIBLINGS=1 ./scripts/start-services.sh`.
# It swaps the default self-contained, pinned node build (context ., go/Dockerfile)
# for the sibling-based build (context tee/, go/Dockerfile.siblings) so an on-disk
# tee-node checkout is compiled into the node instead of the pinned module version.
#
# Go-only: the sibling build compiles tee-node into the Go extension binary.
# start-services.sh rejects USE_LOCAL_SIBLINGS for other languages, which build
# tee-node as a separate binary from a pinned ref instead.
#
# Not chain-specific — start-services.sh attaches it after docker-compose.yaml and
# before any coston/coston2 overlay.
services:
  extension-tee:
    build:
      context: ../..
      dockerfile: extension-examples/extension-scaffold/go/Dockerfile.siblings
